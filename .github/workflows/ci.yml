name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lean-and-numerics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-optimization.txt
      - name: Install reduced-optimization dependencies
        run: python -m pip install -r requirements-optimization.txt
      - name: Reproduce limiting candidate
        run: python3 scripts/analyze_candidate.py
      - name: Reproduce three-pair reflected optimization
        run: python scripts/optimize_reflection_model.py --out /tmp/reduced-optimization.json
      - name: Smoke-test general reflected optimization
        run: >-
          python scripts/optimize_general_reflection_model.py
          --starts 1 --floors 1e-5 --out /tmp/general-optimization.json
      - name: Audit the saved general reflected results
        run: python scripts/audit_general_reflection_model.py
      - name: Certify full-model local optimality at the limiting KKT point
        run: python scripts/certify_limiting_kkt.py --out /tmp/kkt-certificate.json
      - name: Verify the exact degree-three-quarters marginal obstruction
        run: python scripts/analyze_marginal_family.py
      - name: Smoke-test torque-eliminated multistart search
        run: >-
          python scripts/search_general_reflection_model.py
          --near-starts 0 --random-starts 0 --max-branches 1
          --floors 1e-6 --out /tmp/general-search.json
      - name: Check exact clique-blow-up family arithmetic
        run: python3 scripts/clique_blowup_family.py
